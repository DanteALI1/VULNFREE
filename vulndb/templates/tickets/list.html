{% extends "base.html" %}
{% block title %}Заявки{% endblock %}
{% block content %}
<div class="topbar">
  <h1>Заявки</h1>
  <a class="btn" href="/tickets/new/">+ Заявка</a>
</div>
<form class="filters" method="get" hx-get="/tickets/" hx-target="#ticket-table" hx-push-url="true">
  <label>Статус
    <select name="status">
      <option value="">Все</option>
      {% for val,label in statuses %}<option value="{{ val }}" {% if status == val %}selected{% endif %}>{{ label }}</option>{% endfor %}
    </select>
  </label>
  <button class="btn" type="submit">Фильтр</button>
</form>
<div id="ticket-table">{% include "tickets/partials/list_table.html" %}</div>
{% endblock %}
